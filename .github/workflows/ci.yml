name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned development environment
        run: bash dev-env-setup.sh

      - name: Add project tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify environment
        run: |
          node --version
          tsc --version
          biome --version
          /usr/bin/google-chrome --version

      - name: Type check
        run: node --run check

      - name: Lint
        run: node --run lint

      - name: Check formatting
        run: node --run format:check

      - name: Server tests and coverage gate
        run: node --run test:coverage:server

      - name: Browser tests
        env:
          VIDIUM_CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --run test:browser
